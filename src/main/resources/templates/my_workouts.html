<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Workouts | FITNESS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #02040a;
            --card-base: rgba(10, 15, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            background-color: var(--bg-base);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
        }

        .ambient-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background: rgba(10, 15, 25, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            height: 100vh;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .nav-item.active {
            background: linear-gradient(to right, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.1));
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: var(--accent-cyan);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            height: 100vh;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .glass-panel {
            background: var(--card-base);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .tagline { color: var(--text-muted); margin-bottom: 40px; }

        .workout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .workout-card {
            padding: 25px !important;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .workout-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-cyan);
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .type-badge { background: rgba(0,242,254,0.1); color: var(--accent-cyan); padding: 5px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 800; }
        .date-text { font-size: 0.8rem; color: var(--text-muted); }

        .metric-row { display: flex; gap: 20px; margin-top: 15px; }
        .metric { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }

        .form-section { margin-top: 50px; max-width: 600px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff;
        }

        .btn-submit {
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-blue));
            color: #000; border: none; padding: 15px 30px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; width: 100%;
        }
        .btn-submit:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }

        .sidebar-bottom { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--glass-border); }
        .btn-logout { display: flex; align-items: center; gap: 10px; color: #ff4b2b; text-decoration: none; font-weight: 600; padding: 10px 20px; }
    </style>
</head>
<body th:style="'background-image: url(/images/bluish_black_gym.png);'">
    <div class="ambient-overlay"></div>

    <aside class="sidebar">
        <div class="brand">FITNESS</div>
        <nav>
            <a th:href="@{/dashboard/} + ${user.id}" class="nav-item">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M3 9h18M9 21V9"/></svg>
                Dashboard
            </a>
            <a th:href="@{/myWorkouts/} + ${user.id}" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
                My Workouts
            </a>
            <a th:href="@{/goalTarget/} + ${user.id}" class="nav-item">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16L16 12 12 8M8 12h8"/></svg>
                Goals Target
            </a>
            <a th:href="@{/dietPlan/} + ${user.id}" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M11 20.55V2l-2 2v10.55c-1.72.46-3 2-3 3.84 0 2.41 2.04 4.35 4.5 4.35 2.46 0 4.5-1.94 4.5-4.35 0-1.84-1.28-3.38-3-3.84zM18 20.85c2.83 0 5-2.17 5-5s-2.17-5-5-5-5 2.17-5 5 2.17 5 5 5z"/></svg>
                Diet Plan
            </a>
            <a href="/feedback" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
                Feedback
            </a>
        </nav>
        <div class="sidebar-bottom">
            <a href="/" class="btn-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg> Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <h1>Training History</h1>
        <p class="tagline">Every drop of sweat is a step towards greatness, <span th:text="${user.name}"></span>.</p>

        <div class="workout-grid">
            <div th:each="workout : ${workouts}" class="glass-panel workout-card">
                <div class="card-header">
                    <span class="type-badge" th:text="${workout.type}"></span>
                    <span class="date-text" th:text="${workout.workoutDate}"></span>
                </div>
                <h3 th:text="${workout.type} + ' Session'"></h3>
                <div class="metric-row">
                    <div class="metric">🕒 <span th:text="${workout.durationMinutes}"></span> min</div>
                    <div class="metric">🔥 <span th:text="${workout.caloriesBurned}"></span> kcal</div>
                </div>
            </div>
        </div>

        <div class="glass-panel form-section">
            <h2>Log New Session</h2>
            <form th:action="@{/addWorkout/} + ${user.id}" method="post">
                <div class="input-group">
                    <label>Activity Type</label>
                    <select name="type" required>
                        <option value="Strength Training">Strength Training</option>
                        <option value="Cardio">Cardio</option>
                        <option value="Yoga">Yoga</option>
                        <option value="HIIT">HIIT</option>
                    </select>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                    <div class="input-group">
                        <label>Duration (min)</label>
                        <input type="number" name="durationMinutes" required>
                    </div>
                    <div class="input-group">
                        <label>Calories Burned</label>
                        <input type="number" name="caloriesBurned" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" name="workoutDate" required>
                </div>
                <button type="submit" class="btn-submit">LOG WORKOUT</button>
            </form>
        </div>
    </main>
</body>
</html>
